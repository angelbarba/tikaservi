<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Leaflet empaquetado local (assets/leaflet/): antes se cargaba desde
     unpkg.com y en el celular real la pagina cargaba (buscador y botones
     se veian, son HTML/CSS propios) pero el mapa quedaba en blanco - si
     el CDN no carga, "L" nunca se define y el resto del script (que crea
     el mapa Y engancha los botones Buscar/Cancelar/Confirmar) no corre.
     Sirviendolo local no depende de que el celular llegue a ese CDN. -->
<link rel="stylesheet" href="leaflet/leaflet.css" />
<script src="leaflet/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #fff; }
  #panel { display: flex; flex-direction: column; height: 100%; }
  #ayuda { font-size: 13px; color: #555; padding: 10px 10px 6px 10px; }
  #buscador { display: flex; gap: 6px; padding: 0 10px 6px 10px; }
  #input-buscar { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 8px; font-size: 14px; }
  #btn-buscar { background: #1a1a1a; color: #fff; border: none; border-radius: 6px; padding: 0 14px; font-size: 14px; font-weight: 600; }
  #resultados { margin: 0 10px 6px 10px; border: 1px solid #ccc; border-radius: 8px; max-height: 130px; overflow-y: auto; display: none; }
  #resultados button { display: block; width: 100%; text-align: left; background: #fff; border: none; border-bottom: 1px solid #eee; padding: 8px; font-size: 13px; }
  #resultados button:last-child { border-bottom: none; }
  #sin-resultados { margin: 0 10px 6px 10px; font-size: 12px; color: #888; display: none; }
  #mapa { flex: 1; }
  #botonera { display: flex; gap: 8px; padding: 10px; }
  #botonera button { flex: 1; padding: 12px; border: none; border-radius: 0; font-weight: 700; font-size: 15px; }
  #btn-cancelar { background: #eee; color: #222; }
  #btn-confirmar { background: #000; color: #fff; }
  #btn-mi-ubicacion { position: absolute; z-index: 1000; right: 10px; bottom: 90px; background: #fff; border: 1px solid #999; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; }
</style>
</head>
<body>
<div id="panel">
  <div id="ayuda">Arrastrá el pin, tocá el mapa, o buscá una dirección para ajustar el punto exacto de retiro.</div>
  <div id="buscador">
    <input id="input-buscar" type="text" placeholder="Buscar dirección o lugar...">
    <button id="btn-buscar" type="button">Buscar</button>
  </div>
  <div id="resultados"></div>
  <div id="sin-resultados">No se encontraron resultados.</div>
  <div style="position: relative; flex: 1;">
    <div id="mapa" style="height: 100%;"></div>
    <button id="btn-mi-ubicacion" type="button" title="Usar mi ubicación actual">&#128205;</button>
  </div>
  <div id="botonera">
    <button id="btn-cancelar" type="button">Cancelar</button>
    <button id="btn-confirmar" type="button">Confirmar ubicación</button>
  </div>
</div>
<script>
  // Fix geoposicion: mismo picker (Leaflet + Nominatim) que ya usan los
  // portales web pasajero/conductor, portado a una pagina standalone que
  // corre dentro de un WebView. Da las dos opciones que pidio Angel: arranca
  // centrado en la ubicacion real del dispositivo (mandada por Android via
  // query string, Android.kt ya la obtuvo con obtenerUbicacionActual), y
  // deja ajustarla a mano arrastrando el pin, tocando el mapa o buscando una
  // direccion - igual que la web.
  //
  // Si algo de esto falla (Leaflet no cargo, etc) se muestra el motivo
  // directamente en el area del mapa en vez de quedar en blanco sin pistas -
  // no hay forma facil de ver la consola del WebView en el celular real.
  window.onerror = function (mensaje) {
    var mapaDiv = document.getElementById("mapa");
    if (mapaDiv && !mapaDiv.dataset.error) {
      mapaDiv.dataset.error = "1";
      mapaDiv.innerHTML = '<div style="padding:16px;color:#a00;font-size:13px;">' +
        'No se pudo cargar el mapa: ' + mensaje + '</div>';
    }
  };
  if (typeof L === "undefined") {
    throw new Error("Leaflet no se cargo (revisa assets/leaflet/leaflet.js)");
  }

  const params = new URLSearchParams(location.search);
  const latInicial = params.has("lat") ? parseFloat(params.get("lat")) : null;
  const lngInicial = params.has("lng") ? parseFloat(params.get("lng")) : null;
  const CENTRO_DEFECTO = { lat: -22.5209, lng: -63.7967 }; // Tartagal, Salta
  const centro = (latInicial != null && lngInicial != null && !isNaN(latInicial) && !isNaN(lngInicial))
    ? { lat: latInicial, lng: lngInicial }
    : CENTRO_DEFECTO;

  const mapa = L.map("mapa").setView([centro.lat, centro.lng], latInicial != null ? 16 : 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap",
  }).addTo(mapa);
  let marcador = L.marker([centro.lat, centro.lng], { draggable: true }).addTo(mapa);
  mapa.on("click", (e) => marcador.setLatLng(e.latlng));

  document.getElementById("btn-mi-ubicacion").addEventListener("click", () => {
    if (window.AndroidBridge && AndroidBridge.pedirUbicacionActual) {
      AndroidBridge.pedirUbicacionActual();
    }
  });

  // Llamado desde Kotlin cuando llega una ubicacion nueva del GPS/red.
  window.centrarEnUbicacion = function (lat, lng) {
    mapa.setView([lat, lng], 16);
    marcador.setLatLng([lat, lng]);
  };
  window.avisarErrorUbicacion = function (msg) {
    alert(msg);
  };

  const inputBuscar = document.getElementById("input-buscar");
  const btnBuscar = document.getElementById("btn-buscar");
  const contResultados = document.getElementById("resultados");
  const sinResultados = document.getElementById("sin-resultados");
  let resultadosBusqueda = [];

  async function buscarDireccion() {
    const texto = inputBuscar.value.trim();
    if (!texto) return;
    sinResultados.style.display = "none";
    contResultados.style.display = "block";
    contResultados.innerHTML = '<div style="padding:8px;font-size:12px;color:#999;">Buscando...</div>';
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ar"
        + "&viewbox=-64.3,-21.9,-63.3,-23.1&q=" + encodeURIComponent(texto);
      const resp = await fetch(url);
      const datos = await resp.json();
      resultadosBusqueda = datos.map((r) => ({ lat: parseFloat(r.lat), lng: parseFloat(r.lon), nombre: r.display_name }));
      if (!resultadosBusqueda.length) {
        contResultados.style.display = "none";
        contResultados.innerHTML = "";
        sinResultados.style.display = "block";
        return;
      }
      contResultados.innerHTML = resultadosBusqueda.map((r, i) =>
        `<button type="button" data-idx="${i}">${r.nombre.replace(/</g, "&lt;")}</button>`
      ).join("");
    } catch (err) {
      contResultados.style.display = "none";
      contResultados.innerHTML = "";
      sinResultados.textContent = "No se pudo buscar la dirección. Probá de nuevo.";
      sinResultados.style.display = "block";
    }
  }
  btnBuscar.addEventListener("click", buscarDireccion);
  inputBuscar.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); buscarDireccion(); }
  });
  contResultados.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-idx]");
    if (!btn) return;
    const r = resultadosBusqueda[Number(btn.dataset.idx)];
    if (!r) return;
    mapa.setView([r.lat, r.lng], 17);
    marcador.setLatLng([r.lat, r.lng]);
    contResultados.style.display = "none";
    contResultados.innerHTML = "";
  });

  document.getElementById("btn-cancelar").addEventListener("click", () => {
    if (window.AndroidBridge) AndroidBridge.cancelar();
  });
  document.getElementById("btn-confirmar").addEventListener("click", () => {
    const pos = marcador.getLatLng();
    if (window.AndroidBridge) AndroidBridge.confirmar(pos.lat, pos.lng);
  });
</script>
</body>
</html>
